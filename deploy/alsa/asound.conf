# Lucy the Goose: ALSA routing (installed to /etc/asound.conf by deploy/install.sh).
#
# The default device is split so playback and capture can use different cards (for
# example an I2S amplifier plus a USB microphone). Each side goes through `plug`,
# which converts sample rates and formats inside libasound. That lets Lucy record at
# 16 kHz (Whisper's native rate) and play at the voice's 22.05 kHz, whatever the
# hardware supports. Cards are named, not numbered, because USB card numbers can
# change between boots.
#
# Lucy picks the card each time she opens her speaker or microphone and names it in
# LUCY_SPEAKER_CARD / LUCY_MICROPHONE_CARD: the configured card if it is plugged in, or
# else any USB speaker (or microphone) that is (src/lucy/adapters/sound_cards.py). So a
# speaker swapped for a different one just works. Without those variables (aplay,
# speaker-test, alsamixer) the cards below are used.

pcm.!default {
    type asym
    playback.pcm "lucy_playback"
    capture.pcm "lucy_capture"
}

pcm.lucy_playback {
    type plug
    # Many USB speakers play only 48 kHz. ALSA's built-in "linear" converter leaves an image
    # of each tone 23 dB down (measured), which makes her "s" sounds harsh; speexrate (from
    # libasound2-plugins, which install.sh adds) does not. The first one installed is used.
    rate_converter [ "speexrate_medium" "linear" ]
    slave.pcm {
        type hw
        card { @func getenv vars [ LUCY_SPEAKER_CARD ] default "@PLAYBACK_CARD@" }
        device 0
    }
}

pcm.lucy_capture {
    type plug
    slave.pcm {
        type hw
        card { @func getenv vars [ LUCY_MICROPHONE_CARD ] default "@CAPTURE_CARD@" }
        device 0
    }
}

ctl.!default {
    type hw
    card "@PLAYBACK_CARD@"
}
