# Lucy the Goose: runtime configuration (installed to /etc/lucy/config.toml).
#
# Every key is optional. Anything left out uses the built-in default shown here.
# Unknown keys are rejected, so typos are caught at start-up. Check changes with:
#   sudo lucy doctor
#
# API keys (Groq, Speechify) do NOT go in this file. See README.md, "API keys".

log_level = "info"
# system_prompt_file = "/etc/lucy/system_prompt.txt"   # replace Lucy's built-in personality

[api]
base_url = "https://api.groq.com/openai/v1"   # any OpenAI-compatible endpoint works
connect_timeout_s = 3.0
keepalive_s = 120.0                           # keep the TLS connection warm between turns

[stt]
model = "whisper-large-v3-turbo"
language = "en"                # pinning the language skips detection: faster and more accurate
prompt = ""                    # optional spelling hints, e.g. "Lucy, goose"
timeout_s = 8.0
no_speech_threshold = 0.6      # drop segments Whisper thinks are not speech

[llm]
model = "openai/gpt-oss-20b"
fallback_model = "openai/gpt-oss-120b"   # separate free-tier quota; "" disables fallback
timeout_s = 10.0
history_exchanges = 6                    # her short-term memory: the most back-and-forths sent
                                         # word for word (older ones become notes: see [memory])

[llm.params]                             # sent verbatim with every chat request
reasoning_effort = "low"
include_reasoning = false
max_completion_tokens = 512              # includes the (few) reasoning tokens
temperature = 0.8

[llm.fallback_params]
reasoning_effort = "low"
include_reasoning = false
max_completion_tokens = 512
temperature = 0.8

[memory]
# What Lucy remembers of a conversation beyond her short-term memory. Whenever that is full,
# its older half is folded into a few short notes (a name, a favorite animal, the game being
# played). They are written in the background between turns, so no answer waits for them, and
# are kept in RAM only and forgotten with the conversation ([session] forget_after_s).
notes = true                   # false: she just forgets the oldest back-and-forth each turn
max_words = 60                 # the notes never grow past this, however long the conversation
model = "qwen/qwen3.8-27b"     # writes the notes. Not one of the [llm] models: each model has
                               # its own rate limit, so notes never use up the children's
timeout_s = 10.0

[memory.params]                # sent verbatim with every note-taking request
reasoning_effort = "none"      # rewriting notes needs no thinking: quick and cheap
max_completion_tokens = 160
temperature = 0.2

[logbook]
# Lucy's logbook: every conversation, written down for the grown-ups who look after her. Each
# turn she hears words in is a row in an SQLite file on her memory card: what was said to her,
# what she answered, and whether a safety screen stepped in. Read and delete them from a phone
# in setup mode ("Conversations"). She never reads it herself, and no audio is ever kept.
enabled = true                 # false: nothing more is written (what is there stays until deleted)
database = "/var/lib/lucy/logbook.db"   # only Lucy and root can read it; it is not encrypted
keep_days = 30                 # older conversations are deleted; 0 keeps them until you delete them

[local]
# Lucy's own brain on the Pi, used only when GroqCloud cannot be reached.
# Installed and switched on by: sudo deploy/install.sh --local-backup
enabled = false
stt_model = "/opt/lucy/models/faster-whisper-tiny.en"   # speech recognition (faster-whisper)
stt_threads = 4
base_url = "http://127.0.0.1:11434/v1"   # Ollama, localhost only
model = "gemma3:1b"
history_exchanges = 2          # (and her notes) a 1B model on a Pi reads long prompts slowly
timeout_s = 60.0
preload = true                 # load both models at start-up, not during the first offline turn

[local.params]
max_tokens = 100
temperature = 0.7

[safety]
screen = true                  # on-device screens of what kids say and what Lucy says; keep on
extra_patterns = []            # more regular expressions that route to "tell a grown-up"

[tts]
# Lucy's on-device voice (Piper). It speaks whenever the cloud voice below cannot (no Wi-Fi,
# no free characters left), and it is her only voice without a Speechify key.
voice = "/opt/lucy/voices/en_US-lessac-medium.onnx"
threads = 3                    # leave one core free for audio and the event loop
length_scale = 1.0             # > 1.0 speaks more slowly
volume = 0.9
goose_voice = 0.7              # 0 = her plain voice, 1 = as much of a goose as she can be
                               # (higher and smaller, honky, raspy); either voice
honks = true                   # "Honk!" is a goose call, not the word read aloud
honk_volume = 1.0              # 1.0 = about as loud as her voice

[tts.cloud]
# Lucy's natural voice, streamed from Speechify (free: 500,000 characters a month, about
# 3,000 replies). Used only when the Speechify key is installed (README.md, "API keys").
enabled = true
model = "simba-3.2"
voice_id = "harper_32"         # see the choices, with samples to listen to: sudo lucy voices
volume = 1.0                   # match it to the on-device voice's loudness
timeout_s = 2.0                # no audio this soon: the on-device voice says the sentence
rest_s = 60.0                  # after a failure, the on-device voice speaks this long

[audio]
input_device = ""              # "" = ALSA default (configured by deploy/alsa/asound.conf)
output_device = ""
input_sample_rate = 16000      # Whisper's native rate
output_latency_s = 0.08
output_blocksize = 1024

[button]
backend = "gpio"               # "keyboard" = press Enter to talk (bring-up over SSH)
chip = "/dev/gpiochip0"
line = 17                      # BCM numbering: physical pin 11; wire the button to GND
active_low = true
debounce_ms = 15

[led]
enabled = true
chip = "/dev/gpiochip0"
line = 27                      # BCM 27 = physical pin 13, through a 330 ohm resistor
active_low = false

[motors]
# Lucy's beak and body motors on an L293D driver (docs/HARDWARE.md, "Motors"). Switched on,
# with the PWM overlay they need, by: sudo deploy/install.sh --motors. Check the wiring with:
#   sudo systemctl stop lucy && sudo lucy motors
enabled = false
pwm_chip = "/sys/class/pwm/pwmchip0"   # dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4
pwm_frequency_hz = 20000       # above hearing, so the motors don't whine
gpio_chip = "/dev/gpiochip0"
beak_pwm_channel = 0           # GPIO12 (pin 32) -> 1,2EN (L293D pin 1): the beak's speed
beak_forward_line = 22         # GPIO22 (pin 15) -> 1A    (L293D pin 2): high opens the beak
beak_backward_line = 23        # GPIO23 (pin 16) -> 2A    (L293D pin 7)
body_pwm_channel = 1           # GPIO13 (pin 33) -> 3,4EN (L293D pin 9): the body's speed
body_forward_line = 24         # GPIO24 (pin 18) -> 3A    (L293D pin 10)
body_backward_line = 25        # GPIO25 (pin 22) -> 4A    (L293D pin 15)

[motors.motion]
lead_s = 0.05                  # move this much before the sound (motors take a moment)
beak_min_power = 0.35          # just enough to move the beak against its spring
beak_max_power = 0.8           # wide open, without slamming it
body_power = 0.6
body_two_way = true            # false if the body motor may only run forward
bob_every_s = 2.5              # bob at the start of a phrase at most this often; 0 = never
max_hold_s = 2.0               # no motor runs longer than this without a rest (no overheating)

[power]
manage_cpu_governor = true
active_governor = "performance"
standby_governor = "ondemand"
dormant_governor = "powersave"
manage_wifi = true             # Wi-Fi power save off while talking, on while dormant
wifi_interface = "wlan0"

[turn]
min_speech_s = 0.3
speech_threshold_dbfs = -50.0  # check your mic with `lucy doctor --listen`
sentence_pause_s = 0.2
clause_pause_s = 0.08
first_clause_min_words = 0     # 0 = whole sentences (most natural); 4 = start sooner on Piper
max_chunk_words = 30
opening_honk_chance = 0.5      # how often she starts a reply with a honk of her own (never a
                               # sad or serious one); 0 leaves honking to the model
log_transcripts = false        # keep children's words (and replies) out of the system journal
                               # (her logbook is where conversations are kept: see [logbook])

[session]
tap_max_s = 0.3                # a shorter press is a tap: stops Lucy, or explains how to talk
tap_gap_s = 0.7                # taps this close together, then a squeeze, are "the knock" (see
                               # [setup] voice_command); her how-to-talk hint waits this long
max_record_s = 15.0
awake_s = 45.0                 # stay fast this long after a turn, then go dormant
forget_after_s = 300.0         # then forget the conversation entirely, notes and all
max_turns_per_hour = 120       # protects the API quota from a stuck or hammered button
greet_on_start = true
earcons = true
earcon_volume = 1.0            # the chimes: 1.0 = a little louder than her voice

[volume]
# A child can make Lucy louder or quieter by asking ("louder!", "too loud", "speak up"). It
# applies to everything she plays, and lasts until she is turned off.
commands = true
step_db = 3.0                  # each request
max_db = 9.0                   # loudest, above her usual loudness (peaks are rounded off, not clipped)
min_db = -15.0                 # quietest

[setup]
# Setup mode: Lucy turns on her own Wi-Fi and a grown-up's phone opens her settings page (Wi-Fi
# networks, these settings, API keys), so nobody needs SSH or a monitor. docs/OPERATIONS.md,
# "Setup mode". Her setup Wi-Fi's name and password are on the card from: sudo lucy setup-card
enabled = true
hold_to_start_s = 3.0          # hold her wing while she wakes up, this long once she's ready; 0 = off
voice_command = true           # while she's awake: tap her wing twice, then hold it and say
                               # "enter setup mode"
when_offline = true            # start setup mode by herself when no network connects after boot
offline_wait_s = 90.0          # ... within this long
idle_timeout_s = 600.0         # leave setup mode after this long with nothing happening on the page
interface = "wlan0"
hotspot_file = "/etc/lucy/setup-hotspot.toml"   # root-only: her setup Wi-Fi's name and password
credentials_dir = "/etc/lucy/credentials"       # where the page saves API keys (see lucy.service)
