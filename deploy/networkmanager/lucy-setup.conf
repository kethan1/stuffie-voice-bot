# Lucy's setup Wi-Fi (lucy-setup.service): installed to /etc/NetworkManager/dnsmasq-shared.d/.
#
# Every name a phone looks up leads to Lucy (10.42.0.1), so its check for a sign-in page lands
# on her settings page and the phone opens it by itself, as on hotel Wi-Fi. NetworkManager
# only uses this for its shared (hotspot) connections, never on a normal network.
address=/#/10.42.0.1
