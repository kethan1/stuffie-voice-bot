# Lucy on a laptop, for development: `make run` (see README.md, "Running Lucy on a laptop").
#
# Only the settings that differ on a laptop are here. Everything else is the same as on
# the Pi (deploy/config.toml documents every key). Relative paths are relative to this file.
# API keys go in a gitignored .env file (GROQ_API_KEY=..., and SPEECHIFY_API_KEY=... for Lucy's
# natural voice) or the environment.

[tts]
voice = "voices/en_US-lessac-medium.onnx"   # `make voice` downloads it

[audio]
# "" = the laptop's default microphone and speakers. To pick others, list them with
# `uv run python -m sounddevice` and put a name (or part of one) or an index here.
input_device = ""
output_device = ""

[button]
backend = "keyboard"           # Enter starts talking, Enter again stops

[led]
enabled = false                # no LED: status changes are logged at debug level

[power]
manage_cpu_governor = false    # leave the laptop's own power management alone
manage_wifi = false

[turn]
log_transcripts = true         # show what Lucy heard and what the model replied (in your own terminal)

[logbook]
database = "logbook.db"        # beside this file, and gitignored; `make setup` shows what is in it

[local]
# The offline brain, as on the Pi. To try it: `make stt-model`, install Ollama
# (https://ollama.com), `ollama pull gemma3:1b`, then set enabled = true.
enabled = false
stt_model = "models/faster-whisper-tiny.en"
