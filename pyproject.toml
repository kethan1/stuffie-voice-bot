[build-system]
# uv's own backend: uv builds it in-process, so no build tool is downloaded at install time.
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"

[project]
name = "lucy-goose"
version = "1.0.0"
description = "Lucy the Goose: a push-to-talk voice companion for kids, built for the Raspberry Pi 4B."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx[http2]>=0.27,<1",
  "numpy>=1.26,<3",
  "piper-tts>=1.3,<2",
  "segno>=1.6,<2",
  "sounddevice>=0.5,<0.6",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
# Only needed on the Pi (or any Linux board with a GPIO character device). The marker lets
# `make dev` work on a Mac, where gpiod cannot be built.
pi = ["gpiod>=2.2,<3; sys_platform == 'linux'"]
local = [
    "faster-whisper>=1.1,<2",
]

[project.scripts]
lucy = "lucy.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv]
# Only resolve releases at least this old when relocking (supply-chain hygiene).
exclude-newer = "2 weeks"

[tool.uv.build-backend]
module-name = "lucy"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "RET", "PL"]
ignore = [
  "PLR0913", # constructors take their collaborators explicitly
  "PLR0911", # dispatchers read best with early returns
  "PLR2004", # small literal thresholds are clearer inline
  "PLC0415", # hardware libraries are imported lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
# Polling helpers with timeouts are fine in tests; the curly apostrophe is the point of a test.
"tests/*" = ["ASYNC109", "ASYNC110", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sounddevice", "onnxruntime", "piper", "piper.*", "gpiod", "gpiod.*", "faster_whisper"]
ignore_missing_imports = true
